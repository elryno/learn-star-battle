[package]
name = "star-battle-solver"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Learn Star Battle: a Linux puzzle player with screenshot import and guided hints"

[dependencies]
gtk = { package = "gtk4", version = "=0.10.1", features = ["v4_10"] }
adw = { package = "libadwaita", version = "=0.8.0", features = ["v1_4"] }
pangocairo = "=0.21.5"
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "=0.8.1"

[features]
capture = []

[profile.release]
lto = "thin"

